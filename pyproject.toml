[project]
name = "solardashboard"
version = "0.1.0"
description = "Dashboard for solar data from the Fronius API"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "urllib3<2; python_version < '3.10'",
    "wattpilot-api>=1.4.0",
    "unofficial-polestar-api>=0.3.0,<0.4",
]

[tool.uv]
package = false
